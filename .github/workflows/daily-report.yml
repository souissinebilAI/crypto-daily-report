name: Daily crypto report

on:
  schedule:
    # GitHub cron runs in UTC. 09:00 in Berlin is 08:00 UTC in winter and
    # 07:00 UTC in summer, so start at both times and let the gate below decide.
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run only from 09:00 Berlin time
        id: gate
        run: |
          hour=$(TZ=Europe/Berlin date +%-H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$hour" -lt 9 ]; then
            echo "It is $hour:xx in Berlin, the other scheduled start will run the report."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Test
        if: steps.gate.outputs.run == 'true'
        run: python -m unittest discover tests

      - name: Build report
        if: steps.gate.outputs.run == 'true'
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python report.py

      - name: Commit report
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "Nebil Souissi"
          git config user.email "330559755+souissinebilAI@users.noreply.github.com"
          git add README.md reports charts data
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(bot): daily market report $(TZ=Europe/Berlin date +%F)"
          git push
